[project]
name = "livekit-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darshan Pandey", email = "pandeydarshan61@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "flet>=0.86.5",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "livekit-agents[groq,openai,silero,turn-detector]~=1.5",
    "livekit-plugins-ai-coustics>=0.3.2",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
livekit-voice-agent = "livekit_voice_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
