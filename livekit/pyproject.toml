[project]
name = "livekit-voice-agent"
version = "0.1.0"
description = "LiveKit voice agent workers for the support line (receptionist, HR, manager, team lead)"
authors = [
    { name = "Darshan Pandey", email = "pandeydarshan61@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "livekit-agents[groq,openai,silero,turn-detector]~=1.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
